version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: task_management_db
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass123
      POSTGRES_DB: task_management_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d task_management_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: task_management_api
    environment:
      DATABASE_URL: postgresql+asyncpg://taskuser:taskpass123@db:5432/task_management_db
      SECRET_KEY: your-super-secret-key-change-this-in-production
      DEBUG: "True"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
